services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: empirebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha}
      POSTGRES_DB: empirebot
    volumes:
      - empirebot_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empirebot -d empirebot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://empirebot:${POSTGRES_PASSWORD:-troque_esta_senha}@db:5432/empirebot
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
    ports:
      - "${APP_PORT:-5000}:5000"

volumes:
  empirebot_db:
